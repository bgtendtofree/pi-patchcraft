[package]
name = "patchcraft-core"
version = "0.1.0"
edition = "2024"
license = "MIT AND Apache-2.0"
publish = false

[dependencies]
base64 = "0.22"
ctrlc = { version = "3", features = ["termination"] }
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
