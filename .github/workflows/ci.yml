name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: jdx/mise-action@v4

      - name: Run CI gate
        run: mise run ci

      - name: Save verified core for the tagged release
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: core-${{ matrix.platform }}
          path: bin/${{ matrix.platform }}/patchcraft-core
          if-no-files-found: error
